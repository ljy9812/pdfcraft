<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PdfCraft</title>
    
<script type="module">
import init, * as bindings from './pdfcraft-web-989f14f4a6b2be8b.js';
const wasm = await init({ module_or_path: './pdfcraft-web-989f14f4a6b2be8b_bg.wasm' });


window.wasmBindings = bindings;

var loader = document.getElementById('pc-loading');
if (loader) loader.remove();

dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f1f3; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      @media (prefers-color-scheme: dark) { html, body { background: #19191c; } }
    </style>
  <link rel="modulepreload" href="./pdfcraft-web-989f14f4a6b2be8b.js" crossorigin="anonymous"><link rel="preload" href="./pdfcraft-web-989f14f4a6b2be8b_bg.wasm" crossorigin="anonymous" as="fetch" type="application/wasm"></head>
  <body>
    <div id="pc-loading">正在载入 PdfCraft …</div>

    <!-- CJK-round IME diagnostic overlay (button + 取证面板 + __imeRec recorder)
         removed for demo builds; restore from git history for IME forensics. -->

      #pc-loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #6b6b70; font: 14px/1.4 system-ui, sans-serif; z-index: 1; pointer-events: none; }
      @media (prefers-color-scheme: dark) { #pc-loading { color: #a2a2a8; } }
    </style>
  </body>
</html>
